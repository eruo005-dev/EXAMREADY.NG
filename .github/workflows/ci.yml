name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same workflow on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local-only mode so tests apply the auth.users stub before generated migrations.
  LOCAL_DEV: 'true'

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/examready
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/examready
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build (web + admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/examready
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/examready
        run: pnpm db:generate

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/examready
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/examready
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: pnpm build

  db-tests:
    name: Database tests (UNIQUE NULL + heatmap query plan)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: examready_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/examready_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/examready_test
        run: pnpm db:generate

      - name: Run db package tests
        working-directory: packages/db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/examready_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/examready_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/examready_test
        run: pnpm test
